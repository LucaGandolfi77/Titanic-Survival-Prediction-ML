<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="Suite PWA per generazione e modifica sottotitoli SRT, trascrizione audio, editing video — tutto nel browser, 100% locale." />
  <title>SRT Generator Suite</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%236c8ef5'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%236c8ef5'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle' fill='white'%3ET%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/shared.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #21253a;
      --border: #2e3348; --accent: #6c8ef5; --accent2: #4f6de0;
      --text: #e2e6f0; --muted: #7880a0; --radius: 12px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .app-shell { display: flex; flex: 1; overflow: hidden; }
    .nav-sidebar {
      width: 260px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 0; flex-shrink: 0; overflow-y: auto;
    }
    .nav-brand {
      padding: 20px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .nav-brand h1 { font-size: 18px; font-weight: 700; }
    .nav-brand h1 span { color: var(--accent); }
    .nav-brand p { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .nav-links { display: flex; flex-direction: column; padding: 8px; gap: 4px; flex: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      color: var(--muted); text-decoration: none;
      font-size: 14px; font-weight: 500;
      transition: all 0.2s; cursor: pointer;
      border: 1px solid transparent;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active {
      background: rgba(108, 142, 245, 0.12);
      color: var(--accent);
      border-color: rgba(108, 142, 245, 0.3);
    }
    .nav-link .nav-icon { font-size: 20px; width: 32px; text-align: center; }
    .nav-footer {
      padding: 12px 20px; font-size: 11px;
      color: var(--muted); border-top: 1px solid var(--border);
      text-align: center;
    }
    .main-content {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; align-items: center;
    }
    .page { display: none; width: 100%; max-width: 1100px; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Bottom nav for mobile */
    .mobile-nav { display: none; }
    @media (max-width: 900px) {
      .nav-sidebar { display: none; }
      .mobile-nav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--surface); border-top: 1px solid var(--border);
        z-index: 100; padding: 6px 0 env(safe-area-inset-bottom);
        justify-content: space-around;
      }
      .mobile-nav a {
        display: flex; flex-direction: column; align-items: center;
        gap: 2px; padding: 6px 12px; color: var(--muted);
        font-size: 10px; text-decoration: none;
        transition: color 0.2s;
      }
      .mobile-nav a.active { color: var(--accent); }
      .mobile-nav a .nav-icon { font-size: 22px; }
      .main-content { padding-bottom: 70px; }
    }
  </style>
</head>
<body>
  <nav class="nav-sidebar">
    <div class="nav-brand">
      <h1>🎬 <span>SRT</span> Generator</h1>
      <p>100% locale · 100% privato</p>
    </div>
    <div class="nav-links">
      <a class="nav-link active" href="#editor" data-page="editor">
        <span class="nav-icon">✍️</span> SRT Editor
      </a>
      <a class="nav-link" href="#audio" data-page="audio">
        <span class="nav-icon">🎙️</span> Audio → SRT
      </a>
      <a class="nav-link" href="#video-editor" data-page="video-editor">
        <span class="nav-icon">🎬</span> Video Editor
      </a>
      <a class="nav-link" href="#video-audio" data-page="video-audio">
        <span class="nav-icon">🔊</span> Video → Audio
      </a>
      <a class="nav-link" href="#video-subs" data-page="video-subs">
        <span class="nav-icon">🎞️</span> Video + Subt.
      </a>
    </div>
    <div class="nav-footer">PWA · Offline Ready · v2.0</div>
  </nav>

  <nav class="mobile-nav">
    <a class="active" href="#editor" data-page="editor"><span class="nav-icon">✍️</span>Editor</a>
    <a href="#audio" data-page="audio"><span class="nav-icon">🎙️</span>Audio→SRT</a>
    <a href="#video-editor" data-page="video-editor"><span class="nav-icon">🎬</span>Video</a>
    <a href="#video-audio" data-page="video-audio"><span class="nav-icon">🔊</span>V→A</a>
    <a href="#video-subs" data-page="video-subs"><span class="nav-icon">🎞️</span>+Sub</a>
  </nav>

  <button id="theme-toggle" style="position:fixed;top:12px;right:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font-size:16px;z-index:50" title="Toggle tema">🌓</button>

  <main class="main-content">
    <div class="page active" id="page-editor">
      <iframe src="srt_editor.html" frameborder="0" scrolling="auto" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="page" id="page-audio">
      <iframe src="audio_to_srt_free.html" frameborder="0" scrolling="auto" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="page" id="page-video-editor">
      <iframe src="video_editor.html" frameborder="0" scrolling="auto" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="page" id="page-video-audio">
      <iframe src="video_to_audio.html" frameborder="0" scrolling="auto" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
    <div class="page" id="page-video-subs">
      <iframe src="video_with_subs.html" frameborder="0" scrolling="auto" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </main>

  <script type="module">
    import { toggleTheme, addHaptic, autoLoad, setTheme, getTheme } from './js/utils.js';

    // Navigation
    function navigateTo(hash) {
      const pageId = hash.replace('#', '') || 'editor';
      document.querySelectorAll('.nav-link, .mobile-nav a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === pageId);
      });
      document.querySelectorAll('.page').forEach(p => {
        p.classList.toggle('active', p.id === 'page-' + pageId);
      });
    }

    // Tool-switching keyboard shortcuts (1-5)
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && !e.altKey && !e.metaKey) return; // skip if ctrl is held for other shortcuts
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      var toolMap = { '1': 'editor', '2': 'audio', '3': 'video-editor', '4': 'video-audio', '5': 'video-subs' };
      if (toolMap[e.key]) {
        e.preventDefault();
        location.hash = '#' + toolMap[e.key];
        addHaptic(5);
      }
    });
    window.addEventListener('hashchange', () => navigateTo(location.hash));
    document.addEventListener('DOMContentLoaded', () => navigateTo(location.hash || '#editor'));

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // Theme toggle
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      toggle.addEventListener('click', function() { toggleTheme(); addHaptic(5); });
      var saved = autoLoad('srt_theme', 'dark');
      if (saved === 'light') setTheme('light');
      toggle.textContent = saved === 'light' ? '☀️' : '🌓';
      toggle.addEventListener('click', function() {
        setTimeout(function() { toggle.textContent = getTheme() === 'light' ? '☀️' : '🌓'; }, 50);
      });
    }
  </script>
</body>
</html>

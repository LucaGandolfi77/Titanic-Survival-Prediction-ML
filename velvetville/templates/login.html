<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e94560">
    <meta name="description" content="Velvetville Fashion Week Arena - Slay or Nai">
    <title>Velvetville — Fashion Week Arena</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="/static/js/app.js" defer></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const lang = document.getElementById('lang-select')?.value || 'en';
            if (!username) return false;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username}),
                });
                const data = await res.json();
                if (data.status === 'success') {
                    await fetch('/api/set-language', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({language: lang}),
                    });
                    window.location.href = '/game';
                }
            } catch (err) {
                console.error('Login failed', err);
            }
            return false;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="glowing-text" data-i18n="welcome">💅 Velvetville</h1>
            <p>Fashion Week Arena</p>
            <form id="login-form" onsubmit="return handleLogin(event)">
                <select id="lang-select">
                    <option value="en">English</option>
                    <option value="it">Italiano</option>
                    <option value="es">Español</option>
                </select>
                <input type="text" id="username" placeholder="Your username" autocomplete="username" required>
                <button type="submit" data-i18n="enter_runway">Enter the Runway</button>
            </form>
            <p class="login-hint" data-i18n="login_hint">No account needed — just pick a name!</p>
        </div>
    </div>
</body>
</html>

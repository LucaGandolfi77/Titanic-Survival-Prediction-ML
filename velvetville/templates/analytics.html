<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e94560">
    <meta name="description" content="Velvetville Analytics Dashboard">
    <title>Velvetville — Analytics</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/analytics.css">
    <script src="/static/js/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
    <script src="/static/js/analytics.js" defer></script>
</head>
<body>
    <div class="analytics-container">
        <header class="analytics-header">
            <h1 class="glowing-text">📊 Analytics Dashboard</h1>
            <a href="/game" class="back-btn">← Back to Runway</a>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Votes</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Unique Voters</h3>
                <p id="stat-users">0</p>
            </div>
            <div class="stat-card">
                <h3>Avg Score</h3>
                <p id="stat-avg">0</p>
            </div>
            <div class="stat-card">
                <h3>Positive %</h3>
                <p id="stat-positive">0%</p>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h2>Score Distribution</h2>
                <canvas id="chart-distribution"></canvas>
            </div>
            <div class="chart-container">
                <h2>Hourly Activity</h2>
                <canvas id="chart-hourly"></canvas>
            </div>
            <div class="chart-container">
                <h2>Sentiment</h2>
                <canvas id="chart-sentiment"></canvas>
            </div>
            <div class="chart-container">
                <h2>Top Models</h2>
                <canvas id="chart-top"></canvas>
            </div>
        </div>

        <div class="recommendations-section">
            <h2 class="glowing-text">✨ AI Recommendations</h2>
            <div id="recommendations-list"></div>
        </div>
    </div>
</body>
</html>

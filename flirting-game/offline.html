<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline — Speed Crush</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f8f8ff;
      background:
        radial-gradient(circle at top left, rgba(255, 79, 163, 0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(77, 243, 255, 0.18), transparent 24%),
        linear-gradient(135deg, #180b33, #2b0f5f);
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 28px;
      background: rgba(16, 11, 43, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
    }
    .badge {
      display: inline-flex;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.84rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #4df3ff;
    }
    h1 { font-size: 2.2rem; margin: 16px 0 10px; }
    p { color: #d4cbff; line-height: 1.65; margin: 0 0 24px; }
    button {
      font: inherit;
      font-weight: 800;
      padding: 14px 24px;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      color: #1f0838;
      background: linear-gradient(135deg, #ffd44d, #ff94df);
      box-shadow: 0 18px 32px rgba(255, 79, 163, 0.28);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="badge">Offline</div>
    <h1>You're offline</h1>
    <p>
      Speed Crush works fully offline once installed. If you already added it to your
      home screen, open it from there. Otherwise, reconnect and try again.
    </p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e94560">
    <meta name="description" content="Velvetville Fashion Week Arena - Slay or Nai">
    <title>Velvetville — Fashion Week Arena</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/game.css">
    <script src="/static/js/app.js" defer></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="app-container">
        <div id="top-bar">
            <div class="xp-bar">
                <span id="user-xp" class="xp-text">XP: 0</span>
                <div class="xp-track">
                    <div id="xp-fill" class="xp-fill"></div>
                </div>
                <span id="user-level" class="level-badge">Lv.1</span>
            </div>
            <div id="badges-container" class="badges-row"></div>
            <a href="/analytics" class="analytics-link">📊</a>
            <select id="lang-switcher" class="lang-switcher" onchange="changeLang(this.value)">
                <option value="en">EN</option>
                <option value="it">IT</option>
                <option value="es">ES</option>
            </select>
        </div>

        <div id="main-content">
            <div id="game-container">
                <h2 class="glowing-text event-header">
                    Event: Summer Fashion Week (Bonus: x2)
                </h2>
            </div>

            <div id="ui-panel">
                <h1 class="glowing-text">🏆 Leaderboard</h1>
                <ul id="leaderboard-list"></ul>

                <div id="voting-booth">
                    <h2 class="glowing-text" style="margin-top:0;">👠 The Runway</h2>
                    <p>Judging: <b id="target-model">Nobody</b></p>
                    <p>Wearing: <i id="target-outfit">Nothing</i></p>
                    <input type="range" id="score-slider" min="1" max="10" value="5">
                    <div class="score-display-wrap">
                        <span id="score-display">5</span>/10
                    </div>
                    <button id="btn-slay" class="vote-btn slay">Slay/Nay? 💅</button>
                    <button id="btn-skip" class="vote-btn skip">Skip ⏭️</button>
                    <div id="vote-feedback"></div>
                </div>

                <h1 class="glowing-text">💬 Gossip Room</h1>
                <div id="chat-box"></div>
                <div class="input-group">
                    <input type="text" id="chat-input" placeholder="Type something sassy..." maxlength="200">
                    <button id="btn-send">Send 💬</button>
                </div>
                <div id="online-count" class="online-indicator">👥 Connecting...</div>
            </div>
        </div>
    </div>

    <noscript>
        <p style="text-align:center;color:#e94560;padding:20px;">
            Velvetville requires JavaScript enabled.
        </p>
    </noscript>
</body>
</html>

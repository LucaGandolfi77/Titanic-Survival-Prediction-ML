<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="An endless runner 3D game. Dash through train tracks, dodge obstacles, collect coins!">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0e1a'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle'%3E🏃%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%230a0e1a'/%3E%3Ctext x='96' y='120' font-size='100' text-anchor='middle'%3E🏃%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/controls.css">
  <title>Subway Runner</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="hud-score">
      <div class="score-label">Score</div>
      <div class="score-value" id="score-text">0</div>
    </div>

    <div id="hud-coins">
      <div class="coin-icon">$</div>
      <div class="coin-count" id="coin-text">0</div>
    </div>

    <div id="hud-multiplier">x2</div>

    <div id="hud-powerup"></div>

    <div id="hud-combo"></div>

    <div id="damage-flash"></div>

    <div id="distance-meter"><span id="dist-text">0m</span></div>
  </div>

  <div id="hud-mobile-controls">
    <div class="touch-zone" id="touch-left"><span class="touch-icon">⬅️</span></div>
    <div class="touch-zone" id="touch-right"><span class="touch-icon">➡️</span></div>
    <div class="touch-zone" id="touch-jump"><span class="touch-icon">⬆️</span></div>
    <div class="touch-zone" id="touch-slide"><span class="touch-icon">⬇️</span></div>
  </div>

  <div class="swipe-hint" id="swipe-hint">← SWIPE TO MOVE →</div>

  <div id="menu-screen" class="screen">
    <div class="game-title">Subway<br>Runner</div>
    <div class="game-subtitle">Endless 3D Chase</div>
    <div class="character-select" id="character-select"></div>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="btn-play">▶ Play</button>
      <button class="btn btn-secondary" id="btn-leaderboard">🏆 Leaderboard</button>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="pause-title">PAUSED</div>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="btn-resume">▶ Resume</button>
      <button class="btn btn-secondary" id="btn-restart-pause">↻ Restart</button>
      <button class="btn btn-secondary" id="btn-quit">✕ Quit</button>
    </div>
  </div>

  <div id="gameover-screen" class="screen hidden">
    <div class="gameover-title">GAME OVER</div>
    <div class="new-highscore hidden" id="new-highscore">★ NEW HIGH SCORE ★</div>
    <div class="gameover-stats" id="gameover-stats">
      <div class="stat-row"><span class="stat-label">Score</span><span class="stat-value" id="go-score">0</span></div>
      <div class="stat-row"><span class="stat-label">Coins</span><span class="stat-value" id="go-coins">0</span></div>
      <div class="stat-row"><span class="stat-label">Distance</span><span class="stat-value" id="go-distance">0m</span></div>
    </div>
    <div id="leaderboard"></div>
    <div class="menu-buttons">
      <button class="btn btn-primary" id="btn-retry">↻ Retry</button>
      <button class="btn btn-secondary" id="btn-share">📤 Share</button>
      <button class="btn btn-secondary" id="btn-menu">✕ Menu</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
